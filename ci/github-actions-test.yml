# Copy this file to .github/workflows/test.yml to run the tests on GitHub Actions.
# It is kept here because the token that opened this pull request cannot write workflow files.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run tests
        run: sh test.sh
