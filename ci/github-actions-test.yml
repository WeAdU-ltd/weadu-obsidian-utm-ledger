# Same workflow as .github/workflows/test.yml.
# `sh test.sh` runs `node --test test/*.js` (a directory argument fails on Node 22).

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run tests
        run: sh test.sh
